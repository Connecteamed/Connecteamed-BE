name: Deploy Connecteamed (Lightsail, docker compose)

on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:

jobs:
  build:
    name: 🧪 Build (skip tests) + PR comment
    runs-on: ubuntu-latest
    steps:
      - name: ✅ Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: 'gradle'

      - name: 🔧 Grant Gradle permission
        run: chmod +x ./gradlew

      - name: 🔄 Build without running tests
        run: ./gradlew clean build -x test --no-daemon --stacktrace

      - name: ❌ Leave comment on PR if build fails
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const branchName = context.payload.pull_request.head.ref;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `🚨 CI 실패 (브랜치: \`${branchName}\`) - 빌드에 실패했습니다. 로그를 확인하고 수정해주세요!`
            });

      - name: ✅ Leave comment on PR if build succeeds
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const branchName = context.payload.pull_request.head.ref;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `✅ CI 성공 (브랜치: \`${branchName}\`) - 빌드를 통과했습니다!`
            });

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy via SSH (Lightsail)
        uses: appleboy/ssh-action@v1.0.3
        env:
          # 🚨 [수정됨] 여기에 값을 정의해야 envs를 통해 안전하게 넘어갑니다.
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          APP_S3_ACCESS_KEY: ${{ secrets.APP_S3_ACCESS_KEY }}
          APP_S3_SECRET_KEY: ${{ secrets.APP_S3_SECRET_KEY }}
          APP_S3_BUCKET: ${{ secrets.APP_S3_BUCKET }}
          APP_S3_REGION: ${{ secrets.APP_S3_REGION }}
          DOCKER_NETWORK: ${{ secrets.DOCKER_NETWORK }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          FRONTEND_REDIRECT_URL: ${{ secrets.FRONTEND_REDIRECT_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          # 위에서 정의한 env 변수들을 SSH 세션으로 넘김
          envs: DB_HOST,DB_PORT,DB_NAME,DB_USER,DB_PASSWORD,GEMINI_API_KEY,JWT_SECRET_KEY,APP_S3_ACCESS_KEY,APP_S3_SECRET_KEY,APP_S3_BUCKET,APP_S3_REGION,DOCKER_NETWORK,REDIS_PASSWORD,FRONTEND_REDIRECT_URL,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,KAKAO_CLIENT_ID,KAKAO_CLIENT_SECRET,DEPLOY_PATH
          script_stop: true
          script: |
            set -e

            # ==========================================
            # [함수 1] 공통 헬스 체크 함수 (타겟 포트 체크)
            # ==========================================
            wait_for_health() {
              local port=$1
              echo "[Health Check] Waiting for service on port $port..."
              
              for i in $(seq 1 60); do
                code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:${port}/actuator/health || echo "000")
                
                if [ "$code" = "200" ]; then
                  echo "✅ Service is UP (HTTP 200)"
                  return 0
                fi
                sleep 2
              done
              
              echo "❌ Health check failed after 120s."
              return 1
            }

            # ==========================================
            # [함수 2] 롤백 함수
            # ==========================================
            rollback() {
              echo "[ROLLBACK] 🚨 Deployment failed. Reverting..."
              trap - ERR
              
              # 1. 롤백 시에는 그냥 기존 방식(Downtime 감수)으로 복구하거나,
              #    혹은 이전 컬러 컨테이너를 다시 살리는 방식을 쓸 수 있습니다.
              #    안정성을 위해 가장 심플하게 '이전 커밋으로 되돌리고 강제 재배포'를 수행합니다.
              
              git reset --hard "$PREV_COMMIT"
              
              # 기존에 돌던 포트가 죽었을 수 있으므로 다시 살려냅니다.
              # (복잡도를 줄이기 위해 롤백은 싱글 인스턴스로 복구한다고 가정)
              echo "[ROLLBACK] Rebuilding original state..."
              chmod +x ./gradlew
              ./gradlew clean bootJar
              
              # 롤백은 원래 포트(예: 8080)나 현재 타겟의 반대편을 살려야 하지만,
              # 급한 불을 끄기 위해 현재 타겟(실패한 녀석)을 다시 이전 코드로 덮어씁니다.
              
              export APP_PORT=$TARGET_PORT
              export CONTAINER_NAME="app-$TARGET_COLOR"
              
              sudo -E docker compose -p ${TARGET_COLOR} up -d --build
              
              if wait_for_health $TARGET_PORT; then
                echo "[ROLLBACK] ✅ Service restored."
              else
                echo "[ROLLBACK] ❌ Critical Failure."
                exit 1
              fi
            }

            trap 'rollback; exit 1' ERR

            # ==========================================
            # [메인] 배포 로직 시작
            # ==========================================
            
            echo "[1] Move to deploy path"
            cd "$DEPLOY_PATH"

            echo "[2] Check Current Port & Determine Target"
            # 8080 or 8081 추출
            CURRENT_PORT=$(cat /etc/nginx/conf.d/service-url.inc | grep -o '808[0-9]')

            if [ "$CURRENT_PORT" == "8080" ]; then
              TARGET_PORT=8081
              TARGET_COLOR="green"
              CURRENT_COLOR="blue"
            elif [ "$CURRENT_PORT" == "8081" ]; then
              TARGET_PORT=8080
              TARGET_COLOR="blue"
              CURRENT_COLOR="green"
            else
              echo "⚠️ Defaulting to Green(8081)."
              TARGET_PORT=8081
              TARGET_COLOR="green"
              CURRENT_COLOR="blue"
            fi

            echo "🔵 Current: $CURRENT_COLOR ($CURRENT_PORT)"
            echo "🟢 Target : $TARGET_COLOR ($TARGET_PORT)"

            echo "[3] Save Commit & Pull Code"
            PREV_COMMIT=$(git rev-parse HEAD)
            
            git reset --hard HEAD
            git clean -fd
            git fetch origin develop
            git checkout -B develop origin/develop
            git reset --hard origin/develop

            echo "[4] Create .env"
            # ... (env 생성 로직은 기존과 동일하게 유지 - 생략 가능하면 생략하거나 그대로 두세요) ...
            cat <<EOF > .env
            DB_HOST=$DB_HOST
            DB_PORT=$DB_PORT
            DB_NAME=$DB_NAME
            DB_USER=$DB_USER
            DB_PASSWORD=$DB_PASSWORD
            GEMINI_API_KEY=$GEMINI_API_KEY
            JWT_SECRET_KEY=$JWT_SECRET_KEY
            APP_S3_ACCESS_KEY=$APP_S3_ACCESS_KEY
            APP_S3_SECRET_KEY=$APP_S3_SECRET_KEY
            APP_S3_BUCKET=$APP_S3_BUCKET
            APP_S3_REGION=$APP_S3_REGION
            DOCKER_NETWORK=$DOCKER_NETWORK
            REDIS_PASSWORD=$REDIS_PASSWORD
            FRONTEND_REDIRECT_URL=$FRONTEND_REDIRECT_URL
            GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET
            KAKAO_CLIENT_ID=$KAKAO_CLIENT_ID
            KAKAO_CLIENT_SECRET=$KAKAO_CLIENT_SECRET
            EOF
            chmod 600 .env

            echo "[5] Build Jar"
            chmod +x ./gradlew
            ./gradlew clean bootJar

            echo "[6] Run New Container ($TARGET_COLOR)"
            export APP_PORT=$TARGET_PORT
            export CONTAINER_NAME="app-$TARGET_COLOR"
            
            sudo -E docker compose -p ${TARGET_COLOR} up -d --build

            echo "[7] Health Check ($TARGET_COLOR)"
            if ! wait_for_health $TARGET_PORT; then
              echo "❌ New container failed to start."
              sudo docker compose -p ${TARGET_COLOR} logs --tail=50
              sudo -E docker compose -p ${TARGET_COLOR} down
              rollback
              exit 1
            fi

            echo "[8] Switch Nginx Traffic"
            echo "set \$service_url http://127.0.0.1:${TARGET_PORT};" | sudo tee /etc/nginx/conf.d/service-url.inc
            sudo service nginx reload

            echo "[9] Stop Old Container ($CURRENT_COLOR)"
            sudo docker compose -p ${CURRENT_COLOR} down

            echo "[10] Cleanup Unused Images"
            sudo docker image prune -f

            echo "🚀 Blue/Green Deployment Complete!"
