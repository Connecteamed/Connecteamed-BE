name: Deploy Connecteamed (Lightsail, docker-compose)

on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH (Lightsail)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script_stop: true
          script: |
            set -e

            echo "[1] move to deploy path"
            DEPLOY_PATH=${{ secrets.DEPLOY_PATH }}
            cd "$DEPLOY_PATH"

            echo "[2] update source (develop)"
            git fetch --all
            git reset --hard origin/develop

            echo "[3] check docker and docker-compose"
            if ! command -v docker >/dev/null 2>&1; then
              echo "Error: docker not found in PATH."
              exit 1
            fi
            if ! command -v docker-compose >/dev/null 2>&1; then
              echo "Error: docker-compose not found in PATH."
              exit 1
            fi
            docker -v
            docker-compose -v

            echo "[4] write .env (overwrite)"
            cat > .env << 'EOF'
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}

            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}

            APP_S3_ACCESS_KEY=${{ secrets.APP_S3_ACCESS_KEY }}
            APP_S3_SECRET_KEY=${{ secrets.APP_S3_SECRET_KEY }}
            APP_S3_BUCKET=${{ secrets.APP_S3_BUCKET }}
            APP_S3_REGION=${{ secrets.APP_S3_REGION }}

            DOCKER_NETWORK=${{ secrets.DOCKER_NETWORK }}
            EOF

            echo "[5] build jar (no downtime here)"
            chmod +x ./gradlew
            ./gradlew clean bootJar

            echo "[6] rebuild image (no downtime here)"
            docker-compose build app

            echo "[7] restart only app container"
            docker-compose up -d --no-deps --remove-orphans app

            echo "[8] wait until service is back (simple check)"
            for i in $(seq 1 60); do
              if curl -fsS http://localhost:8080/ >/dev/null 2>&1; then
                echo "Service is up"
                break
              fi
              echo "Waiting... ($i/60)"
              sleep 2
            done

            echo "[9] status"
            docker-compose ps
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
