<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Spring+Redis+Yjs Collab Test</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        .container { display: flex; gap: 20px; margin-top: 20px; }
        .box { flex: 1; border: 1px solid #ccc; padding: 10px; border-radius: 8px; }
        textarea { width: 100%; height: 300px; padding: 10px; box-sizing: border-box; }
        #log { background: #f0f0f0; height: 300px; overflow-y: scroll; font-size: 12px; padding: 10px; border: 1px solid #999; }
        .status { font-weight: bold; color: red; }
        .status.connected { color: green; }
        input { padding: 5px; }
        button { padding: 5px 10px; cursor: pointer; }
    </style>
</head>
<body>

<h1>🚀 실시간 동시 편집 테스트 (Yjs + Spring)</h1>

<div>
    <label>Doc ID (방 번호): </label>
    <input type="text" id="docIdInput" value="meeting-1">
    <button id="connectBtn">연결 (Connect)</button>
    <span id="status" class="status">Disconnected</span>
</div>

<div class="container">
    <div class="box">
        <h3>📝 에디터 (Textarea)</h3>
        <textarea id="editor" placeholder="여기에 입력하면 동기화됩니다..."></textarea>
    </div>
    <div class="box">
        <h3>📊 로그 (Logs)</h3>
        <div id="log"></div>
    </div>
</div>

<script type="module">
    import * as Y from 'https://esm.sh/yjs@13.6.14';

    // === 전역 변수 ===
    let ws = null;
    let ydoc = null;
    let ytext = null;
    let myDocId = null;

    const logDiv = document.getElementById('log');
    const statusSpan = document.getElementById('status');
    const editor = document.getElementById('editor');
    const connectBtn = document.getElementById('connectBtn');

    // === 1. Base64 변환 유틸리티 (Java 백엔드와 통신용) ===
    // Uint8Array -> Base64 String
    function toBase64(uint8Array) {
        return btoa(String.fromCharCode(...uint8Array));
    }

    // Base64 String -> Uint8Array
    function fromBase64(base64String) {
        const binaryString = atob(base64String);
        const len = binaryString.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
            bytes[i] = binaryString.charCodeAt(i);
        }
        return bytes;
    }

    // === 2. 로그 출력 ===
    function log(msg, type = 'info') {
        const div = document.createElement('div');
        div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        div.style.color = type === 'in' ? 'blue' : (type === 'out' ? 'green' : 'black');
        logDiv.prepend(div);
    }

    // === 3. 연결 로직 ===
    connectBtn.onclick = () => {
        if (ws) {
            ws.close();
            ws = null;
        }

        const docId = document.getElementById('docIdInput').value;
        myDocId = docId;

        // Yjs 문서 초기화
        ydoc = new Y.Doc();
        ytext = ydoc.getText('content'); // 'content'라는 이름의 공유 텍스트 사용

        // 텍스트 변경 감지 -> 화면 업데이트
        ytext.observe(event => {
            // 커서 위치 유지를 위해 간단히 value만 교체 (실무에선 ProseMirror/Quill 바인딩 사용)
            if (editor.value !== ytext.toString()) {
                const scrollPos = editor.scrollTop;
                editor.value = ytext.toString();
                editor.scrollTop = scrollPos;
            }
        });

        // 사용자가 타이핑했을 때 -> Yjs Update 생성
        editor.oninput = () => {
            // 전체를 갈아끼우는 방식 (테스트용 단순화. 실제는 diff 적용해야 함)
            // 주의: 이 방식은 커서가 튈 수 있음. 실제 구현은 Editor Binding 라이브러리 사용 권장.
            ydoc.transact(() => {
                ytext.delete(0, ytext.length);
                ytext.insert(0, editor.value);
            });
        };

        // ★ Yjs의 변경사항이 발생하면 WebSocket으로 전송 (가장 중요)
        ydoc.on('update', (update, origin) => {
            // origin이 'ws'인 경우(서버에서 온 것)는 다시 보내지 않음 (루프 방지)
            if (origin !== 'ws' && ws && ws.readyState === WebSocket.OPEN) {
                const base64Payload = toBase64(update);
                
                const msg = {
                    type: "UPDATE",
                    docId: myDocId,
                    payload: base64Payload
                };
                
                ws.send(JSON.stringify(msg));
                log(`Sent Update (${base64Payload.length} chars)`, 'out');
            }
        });

        // WebSocket 연결
        const wsUrl = `ws://localhost:8080/ws/docs/${docId}`;
        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
            statusSpan.textContent = "Connected";
            statusSpan.className = "status connected";
            log("WebSocket Connected!");
            
            // (선택) 접속 시 초기화 메시지 전송 가능
            // ws.send(JSON.stringify({ type: "JOIN", docId: docId }));
            const joinMsg = { 
                type: "JOIN", 
                docId: myDocId,
                userId: "user-" + Math.floor(Math.random() * 1000) // 임시 ID
            };
            ws.send(JSON.stringify(joinMsg));
        };

        ws.onmessage = (event) => {
            try {
                const msg = JSON.parse(event.data);
                
                if (msg.type === "UPDATE") {
                    log(`Received Update from User ${msg.userId}`, 'in');
                    
                    // Base64 -> Uint8Array -> Yjs 적용
                    const update = fromBase64(msg.payload);
                    
                    // 'ws'라는 origin 태그를 붙여서 적용 (내가 보낸게 다시 돌아오지 않도록 구분)
                    Y.applyUpdate(ydoc, update, 'ws'); 
                }
            } catch (e) {
                console.error(e);
                log("Error parsing message", 'error');
            }
        };

        ws.onclose = () => {
            statusSpan.textContent = "Disconnected";
            statusSpan.className = "status";
            log("WebSocket Disconnected");
        };
    };

</script>
</body>
</html>
