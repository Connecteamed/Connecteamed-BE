<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Connecteamed: Presence & Auth Test</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 20px; max-width: 900px; margin: 0 auto; background-color: #f9fafb; }
        h1 { color: #111827; margin-bottom: 10px; }
        
        /* 컨트롤 패널 스타일 */
        .controls { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .input-group { margin-bottom: 10px; display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-weight: 600; font-size: 14px; color: #374151; }
        input[type="text"] { padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; width: 100%; box-sizing: border-box; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        button { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; transition: background 0.2s; }
        #connectBtn { background-color: #4f46e5; color: white; }
        #connectBtn:hover { background-color: #4338ca; }
        #disconnectBtn { background-color: #ef4444; color: white; display: none; }
        #disconnectBtn:hover { background-color: #dc2626; }

        /* 접속자 목록 (Presence) 스타일 */
        .presence-container { background: #e0e7ff; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #c7d2fe; }
        .presence-title { font-size: 12px; font-weight: bold; color: #4338ca; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
        #userList { display: flex; gap: 8px; flex-wrap: wrap; }
        .user-avatar { display: flex; align-items: center; gap: 6px; background: white; padding: 6px 12px; border-radius: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); font-size: 13px; font-weight: 500; color: #374151; }
        .user-dot { width: 8px; height: 8px; background-color: #10b981; border-radius: 50%; }

        /* 에디터 및 로그 */
        .container { display: flex; gap: 20px; }
        .box { flex: 1; background: white; border: 1px solid #e5e7eb; padding: 15px; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
        h3 { margin-top: 0; color: #374151; border-bottom: 2px solid #f3f4f6; padding-bottom: 10px; margin-bottom: 10px; }
        textarea { flex: 1; padding: 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; line-height: 1.6; resize: none; font-family: monospace; min-height: 400px; }
        textarea:focus { outline: none; border-color: #4f46e5; ring: 2px solid #4f46e5; }
        
        #log { background: #1f2937; color: #10b981; height: 400px; overflow-y: scroll; font-size: 12px; padding: 15px; border-radius: 6px; font-family: monospace; }
        .log-item { margin-bottom: 4px; border-bottom: 1px solid #374151; padding-bottom: 2px; }
        .log-in { color: #60a5fa; } 
        .log-out { color: #f472b6; }
        .log-sys { color: #fbbf24; }
    </style>
</head>
<body>

<h1>🚀 Connecteamed 협업 테스트</h1>

<div class="controls">
    <div class="input-group">
        <label>JWT Token (로그인 후 받은 토큰):</label>
        <input type="text" id="tokenInput" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...">
    </div>
    <div class="input-group">
        <label>Doc ID (문서 번호):</label>
        <input type="text" id="docIdInput" value="1">
    </div>
    <div class="btn-group">
        <button id="connectBtn">연결 (Connect)</button>
        <button id="disconnectBtn">연결 종료 (Disconnect)</button>
    </div>
</div>

<div class="presence-container">
    <div class="presence-title">현재 접속 중인 멤버 (<span id="userCount">0</span>명)</div>
    <div id="userList">
        <span style="color: #6b7280; font-size: 13px;">연결 대기 중...</span>
    </div>
</div>

<div class="container">
    <div class="box">
        <h3>📝 실시간 에디터</h3>
        <textarea id="editor" placeholder="연결되면 내용을 불러옵니다..."></textarea>
    </div>
    <div class="box">
        <h3>📊 시스템 로그</h3>
        <div id="log"></div>
    </div>
</div>

<script type="module">
    import * as Y from 'https://esm.sh/yjs@13.6.14';

    // === 상태 변수 ===
    let ws = null;
    let ydoc = null;
    let ytext = null;
    let myDocId = null;

    // === DOM 요소 ===
    const logDiv = document.getElementById('log');
    const editor = document.getElementById('editor');
    const userListDiv = document.getElementById('userList');
    const userCountSpan = document.getElementById('userCount');
    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');

    // === 유틸리티 ===
    function toBase64(u8) { return btoa(String.fromCharCode(...u8)); }
    function fromBase64(str) { return Uint8Array.from(atob(str), c => c.charCodeAt(0)); }

    function log(msg, type = 'info') {
        const div = document.createElement('div');
        div.className = 'log-item';
        const time = new Date().toLocaleTimeString();
        let icon = 'ℹ️';
        if(type === 'in') icon = '⬇️';
        if(type === 'out') icon = '⬆️';
        if(type === 'sys') icon = '⚠️';
        
        div.innerHTML = `<span style="color:#9ca3af">[${time}]</span> <span class="${type === 'sys' ? 'log-sys' : (type === 'in' ? 'log-in' : 'log-out')}">${icon} ${msg}</span>`;
        logDiv.prepend(div);
    }

    // === 접속자 렌더링 ===
    function renderPresence(users) {
        userListDiv.innerHTML = '';
        userCountSpan.textContent = users.length;
        
        if (users.length === 0) {
            userListDiv.innerHTML = '<span style="color: #6b7280; font-size: 13px;">접속자가 없습니다.</span>';
            return;
        }

        users.forEach(user => {
            const el = document.createElement('div');
            el.className = 'user-avatar';
            el.innerHTML = `<div class="user-dot"></div> ${user.userName}`;
            userListDiv.appendChild(el);
        });
    }

    // === 연결 로직 ===
    connectBtn.onclick = () => {
        const token = document.getElementById('tokenInput').value.trim();
        const docId = document.getElementById('docIdInput').value.trim();
        
        if (!token) {
            alert("JWT 토큰을 입력해주세요!");
            return;
        }

        if (ws) { ws.close(); }
        myDocId = docId;

        // 1. Yjs 초기화
        ydoc = new Y.Doc();
        ytext = ydoc.getText('content');

        // 2. 바인딩 (Yjs -> Editor)
        ytext.observe(() => {
            if (editor.value !== ytext.toString()) {
                const pos = editor.scrollTop;
                editor.value = ytext.toString();
                editor.scrollTop = pos;
            }
        });

        // 3. 바인딩 (Editor -> Yjs)
        editor.oninput = () => {
            ydoc.transact(() => {
                ytext.delete(0, ytext.length);
                ytext.insert(0, editor.value);
            });
            // 주의: 타이핑 시에는 SAVE_SNAPSHOT 보내지 않음 (최적화)
        };

        // 4. Yjs 업데이트 전송
        ydoc.on('update', (update, origin) => {
            if (origin !== 'ws' && ws && ws.readyState === WebSocket.OPEN) {
                const msg = {
                    type: "UPDATE",
                    docId: myDocId,
                    payload: toBase64(update)
                };
                ws.send(JSON.stringify(msg));
            }
        });

        // 5. WebSocket 연결 (쿼리 파라미터로 토큰 전달)
        // 주의: ws://localhost:8080/ws/docs/{docId}?token={jwt}
        const wsUrl = `ws://localhost:8080/ws/docs/${docId}?token=${token}`;
        log(`Connecting to ${wsUrl}...`, 'sys');
        
        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
            log("WebSocket Connected!", 'sys');
            connectBtn.style.display = 'none';
            disconnectBtn.style.display = 'inline-block';
            
            // 입장 메시지
            ws.send(JSON.stringify({ type: "JOIN", docId: myDocId }));
        };

        ws.onmessage = (event) => {
            try {
                const msg = JSON.parse(event.data);

                // [1] 초기 로딩
                if (msg.type === "INITIAL_LOAD") {
                    log("Loaded DB content", 'in');
                    let applied = false;
                    try {
                        const parsed = JSON.parse(msg.payload);
                        if (Array.isArray(parsed)) {
                            ydoc.transact(() => {
                                parsed.forEach(u => Y.applyUpdate(ydoc, fromBase64(u), 'ws'));
                            });
                            applied = true;
                            log(`Replayed ${parsed.length} updates`, 'in');
                        }
                    } catch(e) {}

                    if (!applied) {
                        ydoc.transact(() => {
                            ytext.delete(0, ytext.length);
                            ytext.insert(0, msg.payload);
                        }, 'ws');
                    }
                } 
                // [2] 실시간 편집
                else if (msg.type === "UPDATE") {
                    Y.applyUpdate(ydoc, fromBase64(msg.payload), 'ws');
                } 
                // [3] 접속자 목록 업데이트 (Presence)
                else if (msg.type === "PRESENCE_UPDATE") {
                    const users = JSON.parse(msg.payload);
                    log(`Presence Update: ${users.length} users`, 'in');
                    renderPresence(users);
                }

            } catch (e) {
                console.error(e);
                log("Error processing message", 'sys');
            }
        };

        ws.onclose = (e) => {
            log(`Disconnected (Code: ${e.code})`, 'sys');
            connectBtn.style.display = 'inline-block';
            disconnectBtn.style.display = 'none';
            userListDiv.innerHTML = '<span style="color:#6b7280">연결 끊김</span>';
            userCountSpan.textContent = '0';
            ws = null;
        };
    };

    // === 연결 종료 ===
    disconnectBtn.onclick = () => {
        if (ws) {
            // 종료 전 스냅샷 저장 시도
            sendSnapshot();
            ws.close();
        }
    };

    // === 창 닫기/새로고침 시 자동 저장 ===
    window.addEventListener("beforeunload", () => {
        if (ws && ws.readyState === WebSocket.OPEN) {
            sendSnapshot();
        }
    });

    function sendSnapshot() {
        if (ws && ws.readyState === WebSocket.OPEN) {
            const msg = {
                type: "SAVE_SNAPSHOT",
                docId: myDocId,
                payload: editor.value
            };
            ws.send(JSON.stringify(msg));
            console.log("Sent Snapshot");
        }
    }

</script>
</body>
</html>
