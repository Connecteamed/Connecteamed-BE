<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Connecteamed: Auto-Login & Presence Test</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 20px; max-width: 900px; margin: 0 auto; background-color: #f9fafb; }
        h1 { color: #111827; margin-bottom: 20px; }
        
        /* 섹션 공통 스타일 */
        .section { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .section h3 { margin-top: 0; margin-bottom: 15px; border-bottom: 2px solid #f3f4f6; padding-bottom: 10px; font-size: 16px; color: #374151; }
        
        /* 로그인 섹션 (초록 테마) */
        .login-section { border-left: 5px solid #10b981; }
        .login-grid { display: flex; gap: 10px; align-items: flex-end; }
        
        /* 연결 섹션 (파랑 테마) */
        .connect-section { border-left: 5px solid #4f46e5; }
        
        .input-group { flex: 1; display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
        .input-group label { font-weight: 600; font-size: 13px; color: #4b5563; }
        input[type="text"], input[type="password"] { padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; width: 100%; box-sizing: border-box; }
        input:focus { outline: none; border-color: #4f46e5; ring: 2px solid #4f46e5; }

        button { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; transition: opacity 0.2s; color: white; white-space: nowrap; }
        button:hover { opacity: 0.9; }
        
        #loginBtn { background-color: #10b981; height: 42px; } /* Green */
        #connectBtn { background-color: #4f46e5; } /* Blue */
        #disconnectBtn { background-color: #ef4444; display: none; } /* Red */

        /* 접속자 목록 & 에디터 */
        .presence-container { background: #e0e7ff; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #c7d2fe; }
        .presence-title { font-size: 12px; font-weight: bold; color: #4338ca; margin-bottom: 8px; text-transform: uppercase; }
        #userList { display: flex; gap: 8px; flex-wrap: wrap; }
        .user-avatar { display: flex; align-items: center; gap: 6px; background: white; padding: 6px 12px; border-radius: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); font-size: 13px; font-weight: 500; color: #374151; }
        .user-dot { width: 8px; height: 8px; background-color: #10b981; border-radius: 50%; }

        .container { display: flex; gap: 20px; }
        .box { flex: 1; background: white; border: 1px solid #e5e7eb; padding: 15px; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
        textarea { flex: 1; padding: 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; line-height: 1.6; resize: none; font-family: monospace; min-height: 400px; }
        #log { background: #1f2937; color: #10b981; height: 400px; overflow-y: scroll; font-size: 12px; padding: 15px; border-radius: 6px; font-family: monospace; }
        .log-item { margin-bottom: 4px; border-bottom: 1px solid #374151; padding-bottom: 2px; }
        .log-in { color: #60a5fa; } .log-out { color: #f472b6; } .log-sys { color: #fbbf24; }
    </style>
</head>
<body>

<h1>🚀 Connecteamed 통합 테스트</h1>

<div class="section login-section">
    <h3>🔐 1. 로그인 (API 호출)</h3>
    <div class="login-grid">
        <div class="input-group">
            <label>Login ID</label>
            <input type="text" id="loginIdInput" value="string1" placeholder="아이디">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="passwordInput" value="string1" placeholder="비밀번호">
        </div>
        <div class="input-group" style="flex: 0;">
            <button id="loginBtn">로그인 & 토큰 받기</button>
        </div>
    </div>
</div>

<div class="section connect-section">
    <h3>🔗 2. 문서 연결 (WebSocket)</h3>
    <div class="input-group">
        <label>JWT Token (로그인 시 자동 입력됨)</label>
        <input type="text" id="tokenInput" placeholder="로그인 버튼을 누르면 자동으로 채워집니다..." readonly style="background-color: #f3f4f6;">
    </div>
    <div class="login-grid">
        <div class="input-group">
            <label>Doc ID (문서 번호)</label>
            <input type="text" id="docIdInput" value="1">
        </div>
        <div class="input-group" style="flex: 0;">
            <button id="connectBtn">소켓 연결</button>
            <button id="disconnectBtn">연결 종료</button>
        </div>
    </div>
</div>

<div class="presence-container">
    <div class="presence-title">현재 접속 중인 멤버 (<span id="userCount">0</span>명)</div>
    <div id="userList">
        <span style="color: #6b7280; font-size: 13px;">연결 대기 중...</span>
    </div>
</div>

<div class="container">
    <div class="box">
        <h3>📝 에디터</h3>
        <textarea id="editor" placeholder="연결되면 내용을 불러옵니다..."></textarea>
    </div>
    <div class="box">
        <h3>📊 로그</h3>
        <div id="log"></div>
    </div>
</div>

<script type="module">
    import * as Y from 'https://esm.sh/yjs@13.6.14';

    // === 전역 변수 ===
    let ws = null;
    let ydoc = null;
    let ytext = null;
    let myDocId = null;

    // === DOM 요소 ===
    const loginIdInput = document.getElementById('loginIdInput');
    const passwordInput = document.getElementById('passwordInput');
    const loginBtn = document.getElementById('loginBtn');
    
    const tokenInput = document.getElementById('tokenInput');
    const docIdInput = document.getElementById('docIdInput');
    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    
    const editor = document.getElementById('editor');
    const logDiv = document.getElementById('log');
    const userListDiv = document.getElementById('userList');
    const userCountSpan = document.getElementById('userCount');

    // === [신규] 로그인 로직 ===
    loginBtn.onclick = async () => {
        const loginId = loginIdInput.value;
        const password = passwordInput.value;

        if(!loginId || !password) {
            alert("아이디와 비밀번호를 입력하세요.");
            return;
        }

        log(`Logging in as ${loginId}...`, 'sys');

        try {
            const response = await fetch('http://localhost:8080/api/auth/login', {
                method: 'POST',
                headers: {
                    'accept': 'application/json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ loginId, password })
            });

            const data = await response.json();

            if (data.status === 'success') {
                const accessToken = data.data.accessToken;
                tokenInput.value = accessToken; // 토큰 자동 입력
                log(`Login Successful! MemberID: ${data.data.memberId}`, 'sys');
                // 편의를 위해 바로 연결 버튼 포커스
                connectBtn.focus();
            } else {
                log(`Login Failed: ${data.message}`, 'sys');
                alert("로그인 실패: " + data.message);
            }

        } catch (e) {
            console.error(e);
            log("Login Error (Check Console/CORS)", 'sys');
            alert("서버 연결 실패. (CORS 설정을 확인하세요)");
        }
    };

    // === 유틸리티 ===
    function toBase64(u8) { return btoa(String.fromCharCode(...u8)); }
    function fromBase64(str) { return Uint8Array.from(atob(str), c => c.charCodeAt(0)); }
    function log(msg, type='info') {
        const div = document.createElement('div');
        div.className = 'log-item';
        div.innerHTML = `<span class="${type === 'sys' ? 'log-sys' : (type === 'in' ? 'log-in' : 'log-out')}">${msg}</span>`;
        logDiv.prepend(div);
    }

    // === 접속자 렌더링 ===
    function renderPresence(users) {
        userListDiv.innerHTML = '';
        userCountSpan.textContent = users.length;
        users.forEach(user => {
            const el = document.createElement('div');
            el.className = 'user-avatar';
            el.innerHTML = `<div class="user-dot"></div> ${user.userName}`;
            userListDiv.appendChild(el);
        });
    }

    // === 연결 로직 ===
    connectBtn.onclick = () => {
        const token = tokenInput.value.trim();
        const docId = docIdInput.value.trim();

        if (!token) { alert("먼저 로그인을 진행해주세요!"); return; }
        if (ws) { ws.close(); }

        myDocId = docId;
        ydoc = new Y.Doc();
        ytext = ydoc.getText('content');

        // 바인딩
        ytext.observe(() => {
            if (editor.value !== ytext.toString()) {
                const pos = editor.scrollTop;
                editor.value = ytext.toString();
                editor.scrollTop = pos;
            }
        });

        editor.oninput = () => {
            ydoc.transact(() => {
                ytext.delete(0, ytext.length);
                ytext.insert(0, editor.value);
            });
        };

        ydoc.on('update', (update, origin) => {
            if (origin !== 'ws' && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "UPDATE", docId: myDocId, payload: toBase64(update) }));
            }
        });

        // 소켓 연결
        const wsUrl = `ws://localhost:8080/ws/docs/${docId}?token=${token}`;
        log(`Connecting...`, 'sys');
        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
            log("Connected!", 'sys');
            connectBtn.style.display = 'none';
            disconnectBtn.style.display = 'inline-block';
            ws.send(JSON.stringify({ type: "JOIN", docId: myDocId }));
        };

        ws.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            if (msg.type === "INITIAL_LOAD") {
                log("DB Loaded", 'in');
                try {
                    const parsed = JSON.parse(msg.payload);
                    if (Array.isArray(parsed)) {
                        ydoc.transact(() => parsed.forEach(u => Y.applyUpdate(ydoc, fromBase64(u), 'ws')));
                    } else { throw new Error(); }
                } catch {
                    ydoc.transact(() => { ytext.delete(0, ytext.length); ytext.insert(0, msg.payload); }, 'ws');
                }
            } else if (msg.type === "UPDATE") {
                Y.applyUpdate(ydoc, fromBase64(msg.payload), 'ws');
            } else if (msg.type === "PRESENCE_UPDATE") {
                const users = JSON.parse(msg.payload);
                log(`Users: ${users.length}`, 'in');
                renderPresence(users);
            }
        };

        ws.onclose = () => {
            log("Disconnected", 'sys');
            connectBtn.style.display = 'inline-block';
            disconnectBtn.style.display = 'none';
            userListDiv.innerHTML = '<span>연결 끊김</span>';
            ws = null;
        };
    };

    disconnectBtn.onclick = () => {
        if(ws) {
            sendSnapshot();
            ws.close();
        }
    };

    window.addEventListener("beforeunload", () => {
        if (ws && ws.readyState === WebSocket.OPEN) sendSnapshot();
    });

    function sendSnapshot() {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: "SAVE_SNAPSHOT", docId: myDocId, payload: editor.value }));
        }
    }
</script>
</body>
</html>
