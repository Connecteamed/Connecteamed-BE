spring:
  application:
    name: connecteamed-be-test

  profiles:
    active: test

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}

  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    open-in-view: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: dummy-google-id
            client-secret: dummy-google-secret
          kakao:
            client-id: dummy-kakao-id
            client-secret: dummy-kakao-secret
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  token:
    secretKey: static_test_key_for_unit_testing_purposes_only_12345
    expiration:
      access: 14400000
      refresh: 1209600000

springdoc:
  swagger-ui:
    path: /docs

server:
  port: 8080


app:
  s3:
    region: ap-northeast-2
    bucket: test-bucket
    access-key: test-access-key
    secret-key: test-secret-key

  test:
    login-id: test@example.com
    user-name: 테스트사용자

  oauth2:
    frontend-redirect-url: http://localhost:5173/login/callback

